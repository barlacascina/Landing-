<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eventi</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #0d0d0d;
    color: white;
    margin: 0;
}

/* BACK */
.back-btn {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 1000;
    background: rgba(0,0,0,0.6);
    color: #d4af37;
    padding: 10px 12px;
    border-radius: 50%;
    text-decoration: none;
    font-size: 18px;
    backdrop-filter: blur(5px);
}

/* BANNER */
#banner {
    height: 280px;
    background-size: cover;
    background-position: center;
    position: relative;
}

#banner::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);
}

.banner-content {
    position: absolute;
    bottom: 15px;
    left: 15px;
    z-index: 2;
}

.banner-content h2 {
    color: #d4af37;
    margin: 0;
}

.banner-content p {
    margin: 5px 0;
    color: #ccc;
}

.banner-btn {
    display: inline-block;
    margin-top: 8px;
    padding: 8px 12px;
    background: #25D366;
    color: black;
    text-decoration: none;
    border-radius: 5px;
    font-weight: bold;
}

/* COUNTDOWN */
#countdown {
    margin-top: 6px;
    font-size: 14px;
    color: #fff;
    font-weight: bold;
}

/* GLOW */
.event-banner-glow {
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { box-shadow: 0 0 5px #d4af37; }
    to { box-shadow: 0 0 18px #d4af37; }
}

/* CONTAINER */
.container {
    padding: 20px;
}

h1 {
    text-align: center;
    color: #d4af37;
}

/* EVENTI */
.evento {
    background: #161616;
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 10px;
}

.evento.next {
    border: 1px solid #d4af37;
}

.evento h2 {
    color: #d4af37;
    text-align: center;
}

.data {
    text-align: center;
    color: #aaa;
    font-size: 14px;
}

.evento img {
    width: 100%;
    border-radius: 10px;
    margin-top: 10px;
}

.evento p {
    text-align: center;
    color: #bbb;
}

/* COUNTDOWN CARD */
.card-countdown {
    text-align: center;
    margin-top: 8px;
    font-size: 13px;
    color: #fff;
}

/* ACTIONS */
.actions {
    text-align: center;
    margin-top: 10px;
}

.whatsapp {
    display: inline-block;
    background: #25D366;
    color: #000;
    font-weight: bold;
    padding: 10px 14px;
    border-radius: 8px;
    text-decoration: none;
}

/* BADGE */
.badge {
    margin-top: 10px;
    text-align: center;
    padding: 5px;
    border-radius: 5px;
    font-size: 12px;
}

.next { background: rgba(212,175,55,0.15); color:#d4af37; }
.live { background: red; color:white; }
.past { background:#333; color:#777; }
</style>
</head>

<body>

<a href="index.html" class="back-btn">←</a>

<div id="banner"></div>

<div class="container">
<h1>Eventi</h1>
<div id="lista-eventi">Caricamento...</div>
</div>

<script>

const API_URL = "https://opensheet.elk.sh/1UNh2jdLhf2wkysFTwjK3CnT-unPeY47vieL1i1AlVNQ/foglio1!B:Z";

/* COUNTDOWN */
function startCountdown(date, element) {

    function update() {
        const now = new Date();
        const target = new Date(date);
        const diff = target - now;

        if (diff <= 0) {
            element.innerHTML = "🔥 IN CORSO ORA";
            return;
        }

        if (diff < 1000 * 60 * 60) {
            element.innerHTML = "🚨 MENO DI 1 ORA!";
            return;
        }

        const giorni = Math.floor(diff / (1000 * 60 * 60 * 24));
        const ore = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minuti = Math.floor((diff / (1000 * 60)) % 60);
        const secondi = Math.floor((diff / 1000) % 60);

        element.innerHTML = `⏳ ${giorni}g ${ore}h ${minuti}m ${secondi}s`;
    }

    update();
    setInterval(update, 1000);
}

async function loadEvents() {

    const container = document.getElementById("lista-eventi");

    try {

        const res = await fetch(API_URL);
        const data = await res.json();

        const now = new Date();

        /* MAPPATURA BASATA SULL'ORDINE DEL FOGLIO */
        let eventi = data.map(ev => {

            const keys = Object.keys(ev);

            return {
                titolo: ev[keys[0]],
                start: ev[keys[1]] ? new Date(ev[keys[1]].replace(" ", "T")) : null,
                end: ev[keys[2]] ? new Date(ev[keys[2]].replace(" ", "T")) : null,
                immagine: ev[keys[3]],
                descrizione: ev[keys[4]],
                telefono: ev[keys[5]]
            };
        });

        /* SORT */
        eventi.sort((a, b) => {
            if (!a.start || isNaN(a.start)) return 1;
            if (!b.start || isNaN(b.start)) return -1;

            const aPast = a.start < now;
            const bPast = b.start < now;

            if (aPast !== bPast) return aPast ? 1 : -1;

            if (!aPast) return a.start - b.start;

            return b.start - a.start;
        });

        const prossimo = eventi.find(e => e.start && e.start > now);

        /* ===== BANNER ===== */
        if (prossimo) {

            const telefono = prossimo.telefono ? prossimo.telefono.toString().replace(/\D/g,'') : "";
            const msg = encodeURIComponent("Ciao! Vorrei prenotare per " + prossimo.titolo);

            const banner = document.getElementById("banner");

            banner.classList.add("event-banner-glow");
            banner.style.backgroundImage = `url('${prossimo.immagine}')`;

            banner.innerHTML = `
                <div class="banner-content">
                    <h2>${prossimo.titolo || ''}</h2>
                    <p>${prossimo.start ? prossimo.start.toLocaleString("it-IT") : ''}</p>

                    <div id="countdown"></div>

                    ${telefono ? `<a class="banner-btn" href="https://wa.me/${telefono}?text=${msg}" target="_blank">Prenota</a>` : ""}
                </div>
            `;

            startCountdown(prossimo.start, document.getElementById("countdown"));
        }

        /* ===== LISTA ===== */
        container.innerHTML = "";

        eventi.forEach(ev => {

            let status = "past";

            if (ev.start && ev.start > now) status = "next";
            if (ev.start && ev.end && now >= ev.start && now <= ev.end) status = "live";

            const telefono = ev.telefono ? ev.telefono.toString().replace(/\D/g,'') : "";
            const msg = encodeURIComponent("Ciao! Vorrei prenotare per " + ev.titolo);

            const div = document.createElement("div");
            div.className = "evento " + status;

            div.innerHTML = `
                <h2>${ev.titolo || ''}</h2>

                ${ev.start ? `<p class="data">${ev.start.toLocaleString("it-IT")}</p>` : ""}

                ${ev.immagine ? `<img src="${ev.immagine}">` : ""}

                <p>${ev.descrizione || ''}</p>

                <div class="actions">
                    ${telefono ? `<a class="whatsapp" href="https://wa.me/${telefono}?text=${msg}" target="_blank">WhatsApp</a>` : ""}
                </div>

                <div class="badge ${status}">
                    ${status === "live" ? "IN CORSO 🔥" : status === "next" ? "PROSSIMO" : "PASSATO"}
                </div>
            `;

            container.appendChild(div);
        });

    } catch (err) {
        container.innerHTML = "⚠️ Errore caricamento dati";
        console.error(err);
    }
}

loadEvents();

</script>

</body>
</html>
