<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eventi</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #0d0d0d;
    color: white;
    margin: 0;
}

/* BANNER */
#banner {
    height: 280px;
    background-size: cover;
    background-position: center;
    position: relative;
}

#banner::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);
}

.banner-content {
    position: absolute;
    bottom: 15px;
    left: 15px;
    z-index: 2;
}

.banner-content h2 {
    color: #d4af37;
    margin: 0;
}

.banner-content p {
    margin: 5px 0;
    color: #ccc;
}

.banner-btn {
    display: inline-block;
    margin-top: 8px;
    padding: 8px 12px;
    background: #25D366;
    color: black;
    text-decoration: none;
    border-radius: 5px;
    font-weight: bold;
}

/* CONTENUTO */
.container {
    padding: 20px;
}

h1 {
    text-align: center;
    color: #d4af37;
}

.evento {
    background: #161616;
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 10px;
}

.evento h2 {
    color: #d4af37;
    text-align: center;
}

.data {
    text-align: center;
    color: #aaa;
    font-size: 14px;
}

.evento img {
    width: 100%;
    border-radius: 10px;
    margin-top: 10px;
}

.evento p {
    text-align: center;
    color: #bbb;
}

.actions {
    text-align: center;
    margin-top: 10px;
}

.actions a {
    display: inline-block;
    margin: 5px;
    padding: 8px 12px;
    background: #222;
    color: white;
    text-decoration: none;
    border-radius: 5px;
}

.whatsapp {
    background: #25D366;
    color: black;
    font-weight: bold;
}

.badge {
    margin-top: 10px;
    text-align: center;
    padding: 5px;
    border-radius: 5px;
    font-size: 12px;
}

.next { background: rgba(212,175,55,0.15); color:#d4af37; }
.live { background: red; color:white; }
.past { background:#333; color:#777; }
</style>
</head>

<body>

<div id="banner"></div>

<div class="container">
<h1>Eventi</h1>
<div id="lista-eventi">Caricamento...</div>
</div>

<script>
const API_URL = "https://opensheet.elk.sh/1UNh2jdLhf2wkysFTwjK3CnT-unPeY47vieL1i1AlVNQ/foglio1!B:Z";

async function loadEvents() {

    const container = document.getElementById("lista-eventi");

    try {

        const res = await fetch(API_URL);
        const data = await res.json();

        const now = new Date();

        let eventi = data.map(ev => ({
            ...ev,
            start: ev["Data inizio"] ? new Date(ev["Data inizio"]) : null,
            end: ev["fine"] ? new Date(ev["fine"]) : null
        }));

        // ORDINE
        eventi.sort((a, b) => {
            if (!a.start) return 1;
            if (!b.start) return -1;

            const aPast = a.start < now;
            const bPast = b.start < now;

            if (aPast !== bPast) return aPast ? 1 : -1;

            if (!aPast) return a.start - b.start;

            return b.start - a.start;
        });

        // BANNER = prossimo evento
        const prossimo = eventi.find(e => e.start && e.start > now);

        if (prossimo) {

            const telefono = prossimo.telefono ? prossimo.telefono.toString().replace(/\D/g,'') : "";
            const msg = encodeURIComponent("Ciao! Vorrei prenotare per " + prossimo.titolo);

            document.getElementById("banner").style.backgroundImage = `url('${prossimo.immagine}')`;

            document.getElementById("banner").innerHTML = `
                <div class="banner-content">
                    <h2>${prossimo.titolo || ''}</h2>
                    <p>${prossimo.start ? prossimo.start.toLocaleString("it-IT") : ''}</p>
                    ${telefono ? `<a class="banner-btn" href="https://wa.me/${telefono}?text=${msg}" target="_blank">Prenota</a>` : ""}
                </div>
            `;
        }

        // LISTA EVENTI
        container.innerHTML = "";

        eventi.forEach(ev => {

            let status = "past";

            if (ev.start && ev.start > now) status = "next";
            if (ev.start && ev.end && now >= ev.start && now <= ev.end) status = "live";

            const telefono = ev.telefono ? ev.telefono.toString().replace(/\D/g,'') : "";
            const msg = encodeURIComponent("Ciao! Vorrei prenotare per " + ev.titolo);

            const div = document.createElement("div");
            div.className = "evento " + status;

            div.innerHTML = `
                <h2>${ev.titolo || ''}</h2>

                ${ev.start ? `<p class="data">${ev.start.toLocaleString("it-IT")}</p>` : ""}

                ${ev.immagine ? `<img src="${ev.immagine}">` : ""}

                <p>${ev.descrizione || ''}</p>

                <div class="actions">
                    ${telefono ? `<a class="whatsapp" href="https://wa.me/${telefono}?text=${msg}" target="_blank">WhatsApp</a>` : ""}
                </div>

                <div class="badge ${status}">
                    ${status === "live" ? "IN CORSO 🔥" : status === "next" ? "PROSSIMO" : "PASSATO"}
                </div>
            `;

            container.appendChild(div);
        });

        if (eventi.length === 0) {
            container.innerHTML = "Nessun evento disponibile";
        }

    } catch (err) {
        console.error(err);
        container.innerHTML = "⚠️ Errore caricamento dati";
    }
}

loadEvents();
</script>

</body>
</html>
