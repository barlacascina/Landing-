<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SORPRESA - La Cascina</title>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            background-color: #050505; 
            color: #d4af37;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            height: 100vh; 
            overflow: hidden;
        }
        .container { width: 90%; max-width: 350px; position: relative; }
        h2 { text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }

        #scratch-container {
            position: relative; 
            width: 300px; 
            height: 160px;
            margin: 0 auto; 
            border: 3px solid #d4af37;
            background-color: #111; 
            touch-action: none;
        }

        #prize-content {
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            z-index: 1; 
            padding: 10px; 
            box-sizing: border-box;
        }

        .prize-text { font-size: 1.1rem; font-weight: bold; color: #fff; margin-bottom: 5px; }
        .win-time { font-size: 0.65rem; color: #888; margin-top: 5px; }

        #scratchCanvas { 
            position: absolute; 
            top: 0; left: 0; 
            z-index: 2; 
            touch-action: none; 
            transition: opacity 0.6s ease; 
        }

        /* TASTO CONVALIDA */
        #redeem-btn {
            display: none;
            margin-top: 15px;
            background: #2ecc71;
            color: #000;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 5px;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
        }

        .back-btn {
            margin-top: 25px; 
            display: inline-block; 
            text-decoration: none; 
            color: #d4af37; 
            border: 1px solid #d4af37; 
            padding: 8px 15px;
            font-size: 0.7rem; 
            border-radius: 5px;
            text-transform: uppercase;
        }

        #limit-message, #redeemed-message { 
            display: none; 
            padding: 20px; 
            border: 2px dashed #d4af37; 
            border-radius: 10px;
            background: rgba(212, 175, 55, 0.05);
        }

        #status { font-size: 0.75rem; color: #d4af37; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div id="limit-message">
            <h2 style="color:#fff">ALT! ✋</h2>
            <p>Hai già tentato la fortuna oggi.</p>
            <p>Torna a trovarci domani!</p>
        </div>

        <div id="redeemed-message">
            <h2 style="color:#2ecc71">RISCATTATO ✅</h2>
            <p>Questo premio è già stato consegnato al banco.</p>
            <p>Ti aspettiamo per la prossima sfida!</p>
        </div>

        <div id="game-area">
            <h2 id="main-title">SFIDA LA SORTE</h2>
            <div id="scratch-container">
                <div id="prize-content">
                    <div class="prize-text" id="prize-text">Caricamento...</div>
                    <div class="win-time" id="win-time"></div>
                </div>
                <canvas id="scratchCanvas" width="300" height="160"></canvas>
            </div>
            <button id="redeem-btn" onclick="redeemPrize()">Convalida al banco</button>
            <p id="status">Usa il dito per scoprire il premio</p>
        </div>

        <a href="index.html" class="back-btn">Torna alla Home</a>
    </div>

    <script>
        const ADMIN_NAME = "FRODO"; 
        const PROBABILITA_VINCITA = 10; 

        const premiVincenti = ["Sconto 10% al Bar! 🎟️", "Caffè offerto! ☕"];
        const frasiPerdenti = ["Niente premio, ma sei bellissimo! ✨", "Ritenta domani! 🍀", "Fortunato in amore! ❤️"];

        const canvas = document.getElementById('scratchCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const prizeText = document.getElementById('prize-text');
        const winTime = document.getElementById('win-time');
        const redeemBtn = document.getElementById('redeem-btn');
        const statusText = document.getElementById('status');
        const gameArea = document.getElementById('game-area');

        let isWin = false;
        const today = new Date().toDateString();

        function init() {
            const user = (localStorage.getItem('cascina_user') || "GUEST").toUpperCase();
            
            // 1. Controllo se ha già riscattato oggi
            if (localStorage.getItem('gratta_redeemed') === today && user !== ADMIN_NAME) {
                gameArea.style.display = 'none';
                document.getElementById('redeemed-message').style.display = 'block';
                return;
            }

            // 2. Controllo se ha già giocato oggi (e non ha vinto)
            if (localStorage.getItem('last_gratta_date') === today && !localStorage.getItem('pending_win') && user !== ADMIN_NAME) {
                gameArea.style.display = 'none';
                document.getElementById('limit-message').style.display = 'block';
                return;
            }

            setupGame(user);
        }

        function setupGame(user) {
            let testo;
            let timeStr = "";

            // Recupero vincita pendente o ne genero una nuova
            const pendingWin = localStorage.getItem('pending_win');
            
            if (pendingWin && user !== ADMIN_NAME) {
                const data = JSON.parse(pendingWin);
                testo = data.text;
                timeStr = data.time;
                isWin = true;
            } else {
                const random = Math.floor(Math.random() * 100) + 1;
                isWin = (user === ADMIN_NAME || random <= PROBABILITA_VINCITA);
                testo = isWin ? premiVincenti[Math.floor(Math.random() * premiVincenti.length)] : frasiPerdenti[Math.floor(Math.random() * frasiPerdenti.length)];
                
                if (isWin) {
                    const ora = new Date();
                    timeStr = "VINTO IL: " + ora.toLocaleDateString() + " ORE " + ora.toLocaleTimeString();
                    if (user !== ADMIN_NAME) {
                        localStorage.setItem('pending_win', JSON.stringify({text: testo, time: timeStr}));
                    }
                }
                if (user !== ADMIN_NAME) localStorage.setItem('last_gratta_date', today);
            }

            prizeText.innerText = testo;
            winTime.innerText = timeStr;

            drawCover();
        }

        function drawCover() {
            ctx.fillStyle = '#777'; 
            ctx.fillRect(0, 0, 300, 160);
            ctx.fillStyle = '#d4af37';
            for(let i=0; i<400; i++) ctx.fillRect(Math.random()*300, Math.random()*160, 2, 2);
            ctx.font = "bold 20px sans-serif";
            ctx.fillStyle = "#222";
            ctx.textAlign = "center";
            ctx.fillText("GRATTA QUI", 150, 90);
        }

        let isDrawing = false;
        function scratch(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches ? e.touches[0] : e;
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath(); 
            ctx.arc(touch.clientX - rect.left, touch.clientY - rect.top, 25, 0, Math.PI * 2); 
            ctx.fill();

            checkScratchProgress();
        }

        function checkScratchProgress() {
            const pixels = ctx.getImageData(0, 0, 300, 160).data;
            let trans = 0;
            for (let i = 3; i < pixels.length; i += 4) if (pixels[i] === 0) trans++;
            
            if (trans > (300 * 160 * 0.5)) {
                canvas.style.opacity = "0";
                setTimeout(() => {
                    canvas.style.display = "none";
                    if (isWin) {
                        statusText.innerHTML = "MOSTRA AL BANCO!";
                        redeemBtn.style.display = "inline-block";
                        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                    } else {
                        statusText.innerText = "PECCATO... A DOMANI!";
                    }
                }, 500);
            }
        }

        function redeemPrize() {
            if (confirm("Attenzione: il barista deve vedere questa azione. Confermi il riscatto?")) {
                localStorage.removeItem('pending_win');
                localStorage.setItem('gratta_redeemed', today);
                location.reload();
            }
        }

        canvas.addEventListener('mousedown', () => isDrawing = true);
        window.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mousemove', scratch);
        canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); }, {passive: false});
        canvas.addEventListener('touchend', () => isDrawing = false);
        canvas.addEventListener('touchmove', scratch, {passive: false});

        window.onload = init;
    </script>
</body>
</html>
