<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
    background: #000;
    color: #eee;
    margin: 0;
}

header {
    text-align: center;
    padding: 30px;
    border-bottom: 2px solid #d4af37;
}

.logo-header {
    max-width: 200px;
    margin: auto;
    display: block;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

.cat-img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 12px;
    margin-top: 35px;
}

h2 {
    color: #d4af37;
    text-align: center;
    margin-top: 30px;
}

.item {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
    border-bottom: 1px solid #111;
    padding-bottom: 6px;
}

.name { color: #fff; }
.price { color: #d4af37; }

.item:hover {
    background: #111;
    padding-left: 5px;
    transition: 0.2s;
}
.note {
    margin-top: 10px;
    font-size: 14px;
    color: #aaa;
    font-style: italic;
    text-align: center;
}
</style>
</head>

<body>

<header>
<img src="logo_trasparente.png" class="logo-header">
</header>

<div class="container" id="menu">Caricamento...</div>

<script>
const API_URL = "https://opensheet.elk.sh/1iy11-9xF7xbGRRFVNarFjfTJlHeOZXV-DvNg-kCfD_Y/foglio1";

async function loadMenu() {
    const res = await fetch(API_URL);
    const data = await res.json();

    const container = document.getElementById("menu");
    container.innerHTML = "";

    const validData = data.filter(item => item.nome && item.nome.trim() !== "");

    let categorie = {};

    validData.forEach(item => {
        const cat = item.categoria || "Altro";
        if (!categorie[cat]) categorie[cat] = [];
        categorie[cat].push(item);
    });

    Object.keys(categorie).forEach(cat => {

        let prodotti = categorie[cat].sort((a, b) => (a.ordine || 0) - (b.ordine || 0));

        let firstImg = prodotti.find(p => p.immagine)?.immagine;

        const section = document.createElement("div");

        section.innerHTML = `
            ${firstImg ? `<img src="${firstImg}" class="cat-img">` : ""}
            <h2>${cat}</h2>
        `;

 prodotti.forEach(p => {

    if (!p.nome) return;

    // 👉 SE È UNA NOTA
    if (p.tipo === "note") {
        section.innerHTML += `
            <div class="note">
                ${p.nome}
            </div>
        `;
        return;
    }

    let prezzo = p.prezzo;

    // gestione vini
    if (p.tipo === "vino" && prezzo && prezzo.includes("/")) {
        const parts = prezzo.split("/");
        prezzo = parts[0].trim() + " / " + parts[1].trim();
    }

    section.innerHTML += `
        <div class="item">
            <span class="name">${p.nome}</span>
            <span class="price">${prezzo || ""}</span>
        </div>
    `;
});

        container.appendChild(section);
    });
}

loadMenu();
</script>

</body>
</html>
